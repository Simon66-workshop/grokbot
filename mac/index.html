<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GrokBot</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: "SF Pro Text", "Helvetica Neue", sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }
      .stage {
        position: relative;
        width: 100%;
        height: 100%;
      }
      .face {
        position: absolute;
        width: 440px;
        height: 440px;
        cursor: grab;
      }
      .face.hold { transform: scale(1.04); }
      .face:active { cursor: grabbing; }
      canvas.bot { display: block; width: 100%; height: 100%; }
      #wheel { display: block; width: 72px; height: 72px; cursor: crosshair; }
      .dock {
        position: absolute;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 140ms ease;
        z-index: 3;
      }
      .stage.open .dock {
        opacity: 1;
        pointer-events: auto;
      }
      .presets { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
      .presets button {
        width: 14px; height: 14px; border-radius: 999px;
        border: 1px solid rgba(255,255,255,0.35);
        padding: 0; cursor: pointer;
      }
      .bar {
        display: flex;
        flex-wrap: nowrap;
        justify-content: center;
        align-items: center;
        gap: 1px;
        padding: 4px 6px;
        background: rgba(22, 21, 19, 0.55);
        border-radius: 999px;
        backdrop-filter: blur(16px);
        white-space: nowrap;
      }
      .bar button {
        border: 0;
        background: transparent;
        color: #fffcf6;
        font: 500 9px/1 "SF Pro Text", sans-serif;
        padding: 6px 6px;
        border-radius: 999px;
        cursor: pointer;
        flex: none;
      }
      .bar button:hover { background: rgba(255,255,255,0.12); }

      /* ball top, dock below */
      .stage[data-side="bottom"] .face { left: 70px; top: 0; }
      .stage[data-side="bottom"] .dock { left: 0; right: 0; top: 400px; }

      /* ball bottom, dock above */
      .stage[data-side="top"] .face { left: 70px; bottom: 0; top: auto; }
      .stage[data-side="top"] .dock { left: 0; right: 0; bottom: 400px; top: auto; }

      /* ball left, dock right (vertical actions) */
      .stage[data-side="right"] .face { left: 0; top: 80px; }
      .stage[data-side="right"] .dock {
        left: 400px; top: 50%; transform: translateY(-50%);
        width: 168px;
      }
      .stage[data-side="right"] .bar,
      .stage[data-side="left"] .bar {
        flex-direction: column;
        border-radius: 16px;
        white-space: normal;
        padding: 6px 8px;
      }
      .stage[data-side="right"] .bar button,
      .stage[data-side="left"] .bar button {
        width: 100%;
        text-align: center;
        padding: 5px 8px;
      }

      /* ball right, dock left */
      .stage[data-side="left"] .face { right: 0; left: auto; top: 80px; }
      .stage[data-side="left"] .dock {
        right: 400px; left: auto; top: 50%; transform: translateY(-50%);
        width: 168px;
      }
    </style>
  </head>
  <body>
    <div class="stage" id="stage" data-side="bottom">
      <div class="face" id="drag">
        <canvas id="face" class="bot" aria-label="Grok Bot"></canvas>
      </div>
      <div class="dock" id="dock">
        <canvas id="wheel" width="108" height="108" aria-label="Body color"></canvas>
        <div class="presets" id="presets"></div>
        <div class="bar">
          <button data-act="idle">Idle</button>
          <button data-act="blink">Blink</button>
          <button data-act="look">Look</button>
          <button data-act="joy">Joy</button>
          <button data-act="think">Think</button>
          <button data-act="wow">Wow</button>
          <button data-act="orbit">Orbit</button>
          <button data-act="bounce">Bounce</button>
          <button data-act="tour">Tour</button>
        </div>
      </div>
    </div>
    <script src="./grokbot.js"></script>
  </body>
</html>
