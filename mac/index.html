<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GrokBot</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: "SF Pro Text", "Helvetica Neue", sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }
      .stage {
        position: relative;
        width: 100%;
        min-height: 100%;
      }
      .face {
        width: 440px;
        height: 440px;
        margin: 0 auto;
        flex: none;
        cursor: grab;
        transform-origin: center;
        transition: transform 160ms ease;
      }
      .face.hold { transform: scale(1.04); }
      .face:active { cursor: grabbing; }
      canvas.bot { display: block; width: 100%; height: 100%; }
      #wheel { display: block; width: 80px; height: 80px; cursor: crosshair; }
      .dock {
        position: absolute;
        left: 50%;
        top: 79%;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        padding: 0 0 8px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 140ms ease;
      }
      .stage:hover .dock,
      .stage.open .dock {
        opacity: 1;
        pointer-events: auto;
      }
      .presets { display: flex; gap: 6px; }
      .presets button {
        width: 14px; height: 14px; border-radius: 999px;
        border: 1px solid rgba(255,255,255,0.35);
        padding: 0; cursor: pointer;
      }
      .bar {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 3px;
        padding: 4px;
        max-width: 260px;
        background: rgba(22, 21, 19, 0.55);
        border-radius: 999px;
        backdrop-filter: blur(16px);
      }
      .bar button {
        border: 0;
        background: transparent;
        color: #fffcf6;
        font: 500 10px/1 "SF Pro Text", sans-serif;
        padding: 6px 7px;
        border-radius: 999px;
        cursor: pointer;
      }
      .bar button:hover { background: rgba(255,255,255,0.12); }
    </style>
  </head>
  <body>
    <div class="stage" id="stage">
      <div class="face" id="drag">
        <canvas id="face" class="bot" aria-label="Grok Bot"></canvas>
      </div>
      <div class="dock" id="dock">
        <canvas id="wheel" width="108" height="108" aria-label="Body color"></canvas>
        <div class="presets" id="presets"></div>
        <div class="bar">
          <button data-act="idle">Idle</button>
          <button data-act="blink">Blink</button>
          <button data-act="look">Look</button>
          <button data-act="joy">Joy</button>
          <button data-act="think">Think</button>
          <button data-act="wow">Wow</button>
          <button data-act="orbit">Orbit</button>
          <button data-act="bounce">Bounce</button>
          <button data-act="tour">Tour</button>
        </div>
      </div>
    </div>
    <script src="./grokbot.js"></script>
  </body>
</html>
